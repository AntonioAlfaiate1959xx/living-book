# Living Book v2 — CI gate + scheduled ensemble refresh (human-in-the-loop).
#
# This workflow NEVER pushes to main and NEVER deploys. The scheduled job
# runs the multi-agent ensemble on a working branch and opens a Pull Request
# for human review, honouring the project rule that no published content
# changes without explicit approval.
#
# Two independent jobs:
#   1. ci          — runs on every push/PR touching the v2 branch: tests +
#                    the deterministic consistency gate. No secrets needed.
#   2. refresh     — scheduled / manual: runs the ensemble (live if a secret
#                    is configured, otherwise mock) and opens a PR.

name: Living Book v2

on:
  push:
    branches: ["feature/living-book-v2"]
  pull_request:
    branches: ["feature/living-book-v2"]
 
  workflow_dispatch:
    inputs:
      question_id:
        description: "Question id to refresh (e.g. q001)"
        required: false
        default: "q001"
      mock:
        description: "Run in offline mock mode (true/false)"
        required: false
        default: "true"

jobs:
  # ── 1. Continuous integration gate ────────────────────────────────
  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the test suite (mocks only, no network)
        run: npm test
      - name: Consistency gate (fails on contradiction candidates)
        run: npm run consistency:check

  # ── 2. Scheduled / manual ensemble refresh → opens a PR ───────────
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/living-book-v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify tests still pass before refreshing
        run: npm test

      - name: Run the multi-agent ensemble refresh
        env:
          ABACUS_API_KEY: ${{ secrets.ABACUS_API_KEY }}
        run: |
          QID="${{ github.event.inputs.question_id }}"
          QID="${QID:-q001}"
          MOCK="${{ github.event.inputs.mock }}"
          if [ -z "$ABACUS_API_KEY" ]; then MOCK="true"; fi
          if [ "$MOCK" = "true" ]; then
            node scripts/orchestrate.js --question-id "$QID" --ensemble --mock
          else
            node scripts/orchestrate.js --question-id "$QID" --ensemble
          fi

      - name: Rebuild the consistency graph
        run: npm run consistency

      - name: Open a Pull Request for review (never pushes to main)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Living Book v2 ensemble refresh"
          branch: "auto/ensemble-refresh"
          base: "feature/living-book-v2"
          title: "Automated ensemble refresh — needs review"
          body: |
            This PR was generated automatically by the Living Book v2
            ensemble workflow. It updates one or more claim files, the
            edition ledger, and the consistency graph.

            **No content is published until a human reviews and merges this PR.**
          labels: |
            automated
            needs-review
