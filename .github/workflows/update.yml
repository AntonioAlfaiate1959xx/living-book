# Weekly auto-refresh for the Living Book (v2 pipeline).
#
# Every Monday at 06:00 UTC this workflow refreshes every active question
# using the v2 orchestrator, rebuilds the published site, and commits the
# results straight back to `main`. GitHub Pages then serves the new edition.
#
# It uses the SAME data store that the published site reads from:
#   - data/claims/*.json      (per-question answers + sources)
#   - editions/ledger.json    (the change history / appendix source)
#   - docs/index.html         (the built book that GitHub Pages serves)
# so every weekly refresh is immediately visible on the site and in the
# "How This Book Has Changed" appendix.

name: Update Living Book

on:
  schedule:
    # minute hour day month weekday  →  06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  # Adds a "Run workflow" button so the refresh can also be triggered by hand.
  workflow_dispatch:

# Only one refresh may run at a time; a new one waits rather than racing.
concurrency:
  group: living-book-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow the job to commit + push the new edition
      pages: write # allow Pages to publish
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4
        with:
          # Use the built-in token so the later `git push` is authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh every active question (v2 orchestrator)
        env:
          # The API key is injected from repo secrets; it never appears in a file.
          # If the secret is missing, the orchestrator falls back to mock mode so
          # the run still completes instead of failing the whole workflow.
          ABACUS_API_KEY: ${{ secrets.ABACUS_API_KEY }}
        run: |
          if [ -z "$ABACUS_API_KEY" ]; then
            echo "::warning::ABACUS_API_KEY secret is not set — running in MOCK mode."
            node scripts/orchestrate.js --all --mock
          else
            node scripts/orchestrate.js --all
          fi
# Claim-Node Layer: runs after the refresh/classify stage and before the
    # rebuild/harmonize stage. Normalizes provenance into persistent, versioned
    # claim nodes and flags suspected contradictions for human review. It never
    # halts the run — flagged claims are quarantined via dispute/report files.
    - name: Build claim nodes + detect contradictions
      run: npm run claims
      - name: Rebuild the published book (v2)
        run: node scripts/build-v2.js

      - name: Commit and push the new edition to main
        run: |
          git config user.name "living-book-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit this week."
          else
            git commit -m "Living edition — weekly refresh $(date -u +%F)"
            git push origin HEAD:main
          fi
