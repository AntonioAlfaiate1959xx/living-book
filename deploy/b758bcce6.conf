# Living Book v2 — Back Office admin
# Public URL: https://b758bcce6.abacusai.cloud
server {
    listen 80;
    server_name b758bcce6.vm.internal;

    # LLM calls can take 30-60s; give plenty of headroom
    proxy_connect_timeout  10s;
    proxy_send_timeout     300s;
    proxy_read_timeout     300s;

    add_header Cache-Control "max-age=0, s-maxage=60";

    location / {
        proxy_pass         http://127.0.0.1:4610;
        proxy_set_header   Host $http_x_original_host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
